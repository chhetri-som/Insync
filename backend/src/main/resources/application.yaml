spring:
  application:
    name: insync
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # pool keeps the DB connections open so each request doesn't create a new TCP connection to Postgres.
    hikari:
      pool-name: InsyncPool
      maximum-pool-size: 10 # max DB connections simultaneously
      minimum-idle: 2 # keeps atleast 2 connections open
      connection-timeout: 30000 # wait time before error
      idle-timeout: 600000 # idle time before connection is closed
      max-lifetime: 1800000 # max lifetime of any connection

  # java persistence api
  jpa:
    hibernate:
      ddl-auto: validate # checks if DB schema matches entities via flyway
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

    # db version control
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # file upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 200MB

  # json serializer
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

insync:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS}
  storage:
    base-path: ${STORAGE_BASE_PATH}
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
  async:
    core-pool-size: ${ASYNC_POOL_SIZE}
    max-pool-size: 8
    queue-capacity: 500

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operation-sorter: method # group endpoints by HTTP

logging:
  level:
    com.insync: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

kind: Application
#debug: true